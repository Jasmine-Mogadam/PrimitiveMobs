plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def modId = 'primitivemobs'
def modName = 'Primitive Mobs'
def minecraftVersion = '1.20.1'
def forgeVersion = '47.4.10'
def baseVersion = '1.20.1-0.1.0-alpha'
def githubRunNumber = System.getenv('GITHUB_RUN_NUMBER')

version = githubRunNumber ? "${baseVersion}-build.${githubRunNumber}" : baseVersion
group = 'net.daveyx0.primitivemobs'

base {
    archivesName = 'primitivemobswondersapped'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraftVersion

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def replaceProperties = [
        minecraft_version: minecraftVersion,
        forge_version: forgeVersion,
        mod_id: modId,
        mod_name: modName,
        mod_version: project.version,
        mod_license: 'All Rights Reserved',
        mod_authors: 'Daveyx0, Jasmine Mogadam',
        mod_description: 'A 1.20.1 porting branch for Primitive Mobs.'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': modId,
            'Specification-Vendor': 'daveyx0',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'daveyx0',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
